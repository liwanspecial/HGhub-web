[package]
name = "hghub-web"
version = "1.2.0"
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"

[features]
native = []

[dependencies]
axum = "=0.8.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "gzip", "brotli", "json", "charset", "stream"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
http = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 2
debug = false
strip = true
codegen-units = 8
lto = false
